# 媒体数据源配置（自动采集驱动：run-daily-task / worker 均读取本队列）
# 新增媒体：在 scrapers/ 加 scraper（或复用 generic），在 registry 注册，并在此追加一条即可。
# 监测范围由 media.monitor_clue=true 决定；本文件仅描述「如何抓取」。
sources:
  # ===== 每日评报（广州同城 6 家，专属解析器）=====
  - media: 广州日报
    business: [daily_review]
    enabled: true
    source_type: 官方网站
    scraper: gzdaily
    entry_urls:
      - https://www.dayoo.com/
      - https://news.dayoo.com/

  - media: 南方日报
    business: [daily_review, news_lead]
    enabled: true
    source_type: 官方网站
    scraper: southcn
    entry_urls:
      - https://www.southcn.com/

  - media: 南方都市报
    business: [daily_review]
    enabled: true
    source_type: 官方网站
    scraper: oeeee
    entry_urls:
      - https://www.oeeee.com/

  - media: 新快报
    business: [daily_review]
    enabled: true
    source_type: 官方网站
    scraper: xkb
    entry_urls:
      - http://www.xkb.com.cn/
      - http://epaper.xkb.com.cn/

  - media: 羊城晚报
    business: [daily_review]
    enabled: true
    source_type: 官方网站
    scraper: ycwb
    entry_urls:
      - http://www.ycwb.com/
      - http://epaper.ycwb.com/

  - media: 信息时报
    business: [daily_review]
    enabled: true
    source_type: 官方网站
    scraper: xxsb
    entry_urls:
      - http://www.xxsb.com/
      - http://epaper.xxsb.com/

